<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Marker Animations</title>
    <style>
        /* Always set the map height explicitly to define the size of the div
        * element that contains the map. */
        #map {
            height: 100%;
        }
        /* Optional: Makes the sample page fill the window. */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>

        // The following example creates a marker in Stockholm, Sweden using a DROP
        // animation. Clicking on the marker will toggle the animation between a BOUNCE
        // animation and no animation.

        var marker;


        function initMap() {
            var map = new google.maps.Map(document.getElementById('map'), {
                zoom: 14,
                center: { lat: 32.9644238949, lng: -96.633312525 }
            });

            marker = new google.maps.Marker({
                map: map,
                draggable: true,
                animation: google.maps.Animation.DROP,
                position: { lat: 32.9644238949, lng: -96.633312525 }
            });
            //marker.addListener('click', toggleBounce);

            var infoWindow = new google.maps.InfoWindow({ maxWidth: 400 });

            var geocoder = new google.maps.Geocoder();

            //google.maps.event.addListener(marker, 'dragend', function (event) {

            google.maps.event.addListener(marker, 'dragend', function (event) {
                //document.getElementById("latbox").value = event.latLng.lat();
                //document.getElementById("lngbox").value = event.latLng.lng();
                geocoder.geocode({ 'latLng': marker.getPosition() }, function (results, status) {
                    if (status == google.maps.GeocoderStatus.OK) {
                        if (results[0]) {
                            // $('#address').val(results[0].formatted_address);
                            var a = marker.getPosition().lat().toString();
                            var b = marker.getPosition().lng().toString();
                            infoWindow.setContent(a, b);
                            infoWindow.open(map, marker);

                            //google.maps.event.addListener(marker, 'mouseover', function () {

                            //    infoWindow.setContent(event.latLng.lat(), event.latLng.lng());
                            //    infoWindow.open(map, marker);

                            //});

                            google.maps.event.addListener(infoWindow, 'closeclick', function () {
                                infoWindow.setContent('');
                            });

                        }
                    }

                });

            })


            function toggleBounce() {
                if (marker.getAnimation() !== null) {
                    marker.setAnimation(null);
                } else {
                    marker.setAnimation(google.maps.Animation.BOUNCE);
                }
            }

        }
    </script>

    <script type="text/javascript">
        
    </script>
        
        <script async defer
                src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBuy8PkXAoVQWsNpBl7Wt-mlYJNde4sals&callback=initMap">
        </script>
    </body>
</html>
