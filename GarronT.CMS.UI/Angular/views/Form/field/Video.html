<div class="col-md-12 ">

    <div class="form-group">
        <label for="name" class="col-lg-3"> <strong> Field Label:</strong><span style="color:red">*</span></label>
        <div class="col-lg-9">
            <div><input type="text" class="form-control" maxlength="200" id="txtfieldtitle" ng-blur="FieldLabelCheck(field.field_FieldLabel)" ng-model="field.field_FieldLabel" value="{{field.field_FieldLabel}}"></div>
        </div>
    </div>

    <div class="form-group">
        <label for="name" class="col-lg-3"><strong>Hint Text:</strong></label>
        <div class="col-lg-9">
            <div><input type="text" maxlength="200" class="form-control" ng-model="field.field_HintText" value="{{field.field_HintText}}"></div>
        </div>
    </div>

    <div class="form-group">
        <div class="checkbox col-md-5">
            <label for="checkbox1" style="padding-left: 0px;">
                <span>Hide Field Label</span>
            </label>
            <input type="checkbox" class="col-lg-2 pull-right" ng-model="field.field_HideFieldLabel" value="{{field.field_HideFieldLabel}}" />
        </div>
    </div>
    <div class="form-group">

        <div class="checkbox col-md-5">
            <label for="checkbox1" style="padding-left: 0px;">
                <span>Photo Library Enabled</span>
            </label>
            <input type="checkbox" id="checkbox1" class="col-lg-2 pull-right" ng-model="field.field_PhotoLibraryEnabled" value="{{field.field_PhotoLibraryEnabled}}" />
        </div>
        <div class="checkbox col-md-5">
            <label for="checkbox1" style="padding-left: 0px;">
                <span>Camera Enabled</span>
            </label>
            <input type="checkbox" id="checkbox1" class="col-lg-2 pull-right" ng-model="field.field_CameraEnabled" value="{{field.field_CameraEnabled}}" />
        </div>

    </div>
    <div class="form-group">
        <label for="name" class="col-lg-6"><strong>Max Recordable Time (Seconds):</strong></label>
        <div class="col-lg-6">
            <div><input type="text" maxlength="200" numeric-only class="form-control" ng-model="field.field_MaxrecordabletimeInSeconds" value="{{field.field_MaxrecordabletimeInSeconds}}"></div>
        </div>
    </div>
    <div class="form-group">
        <label for="name" class="col-lg-3"><strong>Video Quality:</strong></label>
        <div class="col-lg-9">
            <div>
                <select class="form-control" ng-model="field.field_VideoQuality">
                    <option value="Low">Normal</option>
                    <option value="Med">Medium</option>
                    <option value="High">High</option>


                </select>
            </div>
        </div>
    </div>

    <div class="form-group">

        <div class="checkbox col-md-5">
            <label for="checkbox1" style="padding-left: 0px;">
                <span>Required</span>
            </label>
            <input type="checkbox" id="checkbox1" class="col-lg-2 pull-right" ng-model="field.field_IsRequired" value="{{field.field_IsRequired}}" />
        </div>
        <div class="checkbox col-md-5">
            <label for="checkbox1" style="padding-left: 0px;">
                <span>Capture Geolocation</span>
            </label>
            <input type="checkbox" id="checkbox1" class="col-lg-2 pull-right" ng-model="field.field_CaptureGeolocation" value="{{field.field_CaptureGeolocation}}" />
        </div>

    </div>
    <div class="form-group">

        <div class="checkbox col-md-5">
            <label for="checkbox1" style="padding-left: 0px;">
                <span>Enabled</span>
            </label>
            <input type="checkbox" id="checkbox1" class="col-lg-2 pull-right" ng-model="field.field_IsEnabled" value="{{field.field_IsEnabled}}" />
        </div>

        <div class="checkbox col-md-5">
            <label for="checkbox1" style="padding-left: 0px;">
                <span>Capture Timestamp</span>
            </label>
            <input type="checkbox" id="checkbox1" class="col-lg-2 pull-right" ng-model="field.field_CaptureTimestamp" value="{{field.field_CaptureTimestamp}}" />
        </div>
    </div>


</div>
