<div>
    <section id="main-content">
        <section class="wrapper">
            <!-- page start-->

                    <section class="panel add_frm_panel " style="">
                        <header class="panel-heading frmmngt_header" style="padding-top:5px;border:none;">
                            <b>Form Management </b>

                        </header>
                        <div>
                            <form id="FormManagementForm" name="FormManagement">

                                <div class="row">
                                    <div class="col-lg-12 col-sm-12 col-xs-12 frm_mngt_box">
                                        <div class="form-group col-lg-2 col-sm-6 col-xs-12 form_chos_sel">
                                            <input type="hidden" id="hdnFormID" />
                                            <!--<label for="name">Project Name<span style="color:red">*</span></label>-->
                                            <select data-placeholder="Select Project" name="ddlProjectdropdown" id="ddlProject" class="form-control chosen-select "></select>

                                        </div>

                                        <div class="form-group col-lg-3 col-sm-6 col-xs-12 addfrm_instest ">
                                            <!--<label for="name">Form Name<span style="color:red">*</span></label>-->

                                            <input type="text" name="NewFormName" placeholder="Enter Form Name" maxlength="200" id="txtNewFormName" class=" form-control addfrm-name" />

                                        </div>
                                        <div class="form-group col-lg-2 col-sm-6 col-xs-12 addfrm_frmtype">
                                            <!--<label for="name">End Date<span style="color:red">*</span></label>-->
                                            <select data-placeholder="Select Form Type" id="ddlFormType" name="FormType" class="form-control chosen-select"></select>

                                        </div>
                                        <div class="form-group col-lg-2 col-sm-3 col-xs-6 addfrm_fromdte ">
                                            <!--<label for="name">Start Date<span style="color:red">*</span></label>-->
                                            <input type="text" name="FromDate" placeholder="Start Date" readonly="readonly" onkeypress="return false" id="txtFromDate" class=" form-control" />

                                        </div>
                                        <div class="form-group col-lg-2 col-sm-3 col-xs-6 addfrm_todte">
                                            <!--<label for="name">End Date<span style="color:red">*</span></label>-->
                                            <input type="text" name="ToDate" placeholder="End Date" readonly="readonly" onkeypress="return false" id="txtToDate" class="inputclass form-control" />

                                        </div>

                                    </div>
                                </div>
                            </form>
                            <br /><br />
                            <!--<div class="form-group">
                                <p style="padding-left: 16px;"><strong>You can select already existing form fields here</strong></p>
                            </div>-->

                            </div>-->

                            <div class="form-group frm-footbtn" style="text-align:center; margin:9px 0px">
                                <strong id="lblnote" class="pull-left">Note:- This form is submitted by installer, you can't update.</strong>
                                <button id="btnSave" ng-click="FormSave()" class="btn btn-success" type="button">Save</button>
                                <button id="btnCancel" ng-click="FormCancel()" class="btn btn-danger" type="button">Cancel</button>
                                <button id="btnReset" ng-click="FormReset()" class="btn btn-info" type="button">Reset</button>
                            </div>

                                                    <button type="submit" id="btnDeleteSection" ng-disabled="DisableSectionEditDelete()" ng-click="DeleteSection()" title="Delete Section" class="btn btn-default btn-sm btn-flied"> <i class="fa fa-times" style="font-size: 14px;color: #d2322d;"></i> </button>
