# -----------------------------------------------------------------------------
background_jobs:
  CMSShedulerService:
    type: Windows Service
    loop: while true; if same calendar day then AddToAudit + AllocateAuditVisit; Sleep 3 hours
    installer: CMS Audit scheduler Project.vdproj
  CMSAuditThread:
    type: Console (Task Scheduler)
    runs: setMobileSyncStatus(25)
    commented: PendingAllCrossesDateAddress, CalPendingLatLongForProject
  TNMPUploadUtility:
    type: Console (Task Scheduler)
    argument: ProjectID (default 10122)
    active: [ProcessCloudUrls]
    commented:
      - SFTP ingest UploadFile
      - DownloadExportReport + SFTP upload
      - SkipAccountMovedToUnAllocate
      - getFilesPath year-range S3
      - thumbnail S3
      - Export WITH_METER email
      - Export WITHOUT_METER email
  hangfire: package present; not wired as the primary scheduler

hardcoded_project_ids:
  - { id: 10075, note: debug special-case in mobile sync (user 14, cycle 16) }
  - { id: 10087, note: TNMP HQ SFTP ingest + export date window }
  - { id: 10117, note: commented TNMP CMS export }
  - { id: 10122, note: TNMP utility default ProjectID arg; historical S3 path filter }
  - { id: 10124, note: TNMP CMS V125 SFTP ingest/export }
  - { id: 10134, note: Beaumont email exports WITH_METER / WITHOUT_METER; budget report }

app_settings_keys:
  web_config:
    - Version, WebURL, UploadFilePath, InventoryUploadPath, ClockTimeReportUploadPath
    - InventorySampleFile, NewInventorySampleFile, ProjectSampleFile
    - googleapiKey, distanceFromCityCenterInKM
    - WebMasterMailId, WebMasterMailPassword, WebMasterSMTPServer, WebMasterPort, WebMasterEnableSSL
    - DefaultPassword, webApiUploadCustomeImage
  tnmp_app_config:
    - sftpurl, sftpuid, sftppwd, remoteDir, pathRemoteFile, movingfilepathRemoteFile, sftOutputFilePath
    - CloudUploadBatchSize, ValidateExistingCloudUrls, mergeCycleOfficeColumn
    - webmastermailid, googleapiKey, distanceFromCityCenterInKM, WebURL

uploads_paths:
  mobile: MobileUploadData\   # appSetting UploadFilePath = ..\..\MobileUploadData\
  inventory: ~/InventoryUpload/
  clock_time: ~/ClockTimeReport/
  gitignore: [bin/, obj/, MobileUploadData/, InventoryUpload/, ClockTimeReport/, Logs/, .vs/]

build:
  configuration: [Debug, Release]
  nuget: packages.config → packages\
  sqlserver_types: >
    Copy nativeBinaries from Microsoft.SqlServer.Types package into
    GarronT.CMS.Model/SqlServerTypes/{x64,x86} and GarronT.CMS.UI/SqlServerTypes/{x64,x86}
    (msvcr120.dll, SqlServerSpatial140.dll). Missing files break Model compile.

run_local:
  - Restore NuGet
  - Confirm SQL Server + CMSMeterLive in Web.config
  - Copy SqlServerTypes DLLs if missing
  - Set GarronT.CMS.UI as startup, F5 → http://localhost:6070/
  - Login: http://localhost:6070/Global/Login
  - New-user default password (Web.config DefaultPassword): admin@123
  - Do not commit DB/SFTP/mail secrets or the file-upload API token

run_utilities:
  tnmp_s3: >
    Run TNMPUploadUtility.exe on the web server (inetpub path required).
    Nightly until pending strCloudUrl backlog is 0. Batch 5000 per run.
  audit_service: Install CMSShedulerService via vdproj / installutil
  mobile_sync: Schedule CMSAuditThread.exe

qa:
  guide: README.md
  coverage: README.md section 2.1 (entire-project matrix) + TC-01..TC-26
  do_not_fail_as_bugs: see README section 6 and pipelines.*.status COMMENTED
  sample_files:
    accounts: ~/DownLoadFile/Sample Upload File.xlsx
    inventory: ~/DownLoadFile/Sample Inventory Upload File.xlsx
  http_runtime:
    maxRequestLength: 2147483647
    executionTimeout_seconds: 1600
