# =============================================================================
# DataDepot / GarronT.CMS — full project configuration
# Generated from the live codebase. Secrets are keys only, never values.
# =============================================================================

project:
  name: DataDepot
  product: GarronT.CMS
  aliases: [CMSMeter, DataDepot Online, CMSMeterLive]
  version: v1.0015
  solution: GarronT.CMS.sln
  runtime: net48
  ide: Visual Studio 2017+ (solution format 12.00 / VS 15)
  local_web_url: http://localhost:6070/
  local_login_url: http://localhost:6070/Global/Login
  live_web_url: https://www.datadepotonline.com/
  live_login_url: https://www.datadepotonline.com/Global/Login
  help_manual: GarronT.CMS.UI/CMSHelpManual/quick/toc.html
  tester_guide: README.md   # QA click-paths, coverage matrix, sign-off — not duplicated here
  description: >
    Enterprise construction / field-service CMS for utility meter installation.
    Covers projects, dynamic forms, installer allocation, mobile field capture,
    inventory, audits, appointments, reporting, and TNMP SFTP/S3 utilities.

# Who reads which file
docs:
  readme: README.md                    # testers — smoke, TC-01..26, ASMX how-to, sign-off
  this_file: Projectconfig.yml         # modules, tables, APIs, job ON/OFF, secrets as keys only
  in_app_help: GarronT.CMS.UI/CMSHelpManual/quick/toc.html
  do_not_put_in_yaml:
    - step-by-step test cases (stay in README)
    - secret values (passwords, SFTP, API tokens)

tech_stack:
  backend:
    - .NET Framework 4.8
    - ASP.NET MVC 5.2.3
    - ASP.NET Web API 2
    - OWIN + ASP.NET Identity 2.1 (cookie auth)
    - Entity Framework 6.1.3 (database-first EDMX Compass.edmx)
    - log4net 2.0.5
  libraries:
    - EPPlus 4.0.4          # Excel
    - iTextSharp 5.5.9      # PDF
    - Hangfire 1.8.6        # referenced; not the primary scheduler
    - Magick.NET 7.9.2      # images
    - SSH.NET / Renci.SshNet # SFTP (TNMP utility)
    - RestSharp             # S3 file-upload API
    - AutoMapper 4.1.1
    - Report Viewer (Microsoft.ReportingServices)
    - Google Maps LocationServices / Jmelosegui.Mvc.Googlemap
  frontend:
    - Bootstrap 3
    - jQuery 2.1.4
    - AngularJS (Form Management + Content/AngularJS)
    - Chosen, DataTables, Summernote, CKEditor (admin theme Content/MSTS)
  database:
    engine: SQL Server
    context: CompassEntities
    identity_context: ApplicationDbContext / DefaultConnection

# -----------------------------------------------------------------------------
solution:
  projects:
    - name: GarronT.CMS.Model
      path: GarronT.CMS.Model/
      type: class-library
      role: EF6 EDMX, ~100 DbSets, DAL (~48), BO (~85), stored-proc wrappers
    - name: GarronT.CMS.UI
      path: GarronT.CMS.UI/
      type: aspnet-mvc
      role: Web UI, Web API, CMS_MobileService.asmx
      startup: true
      port: 6070
    - name: CMSAuditThread
      path: CMSAuditThread/
      type: console
      role: Mobile sync — set UploadedExcelData.SyncEnable = 0 via PROC_MobileSync_GetAfterTop
      entry: MobileSyncUtil.triggerScheduler
    - name: CMSShedulerService
      path: CMSShedulerService/
      type: windows-service
      role: Audit AddToAudit + AllocateAuditVisit every 3 hours
      entry: CMSSchedule.OnStart → startTheScheduler
    - name: TNMPUploadUtility
      path: TNMPUploadUtility/
      type: console
      role: S3 cloud-URL backfill (ACTIVE); SFTP ingest/export and email CSV (commented)
      entry: Program.Main
      args: "[optional ProjectID] default 10122"
    - name: WindowsFormsApplication1
      path: WindowsFormsApplication1/
      type: winforms
      role: Legacy helper
    - name: CMS Audit scheduler Project
      path: CMS Audit scheduler Project/
      type: vdproj
      role: Visual Studio installer for the Windows service

