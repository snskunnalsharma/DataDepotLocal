    controller: InstallerDashboardController.Index
    note: Minimal dashboard stub
  - name: SuperAdmin
    registration: NONE
    controller: SuperAdminDashboardController.Index
    note: Minimal dashboard stub
  root_controllers:
    - HomeController
    - AccountController
    - ManageController
    - ErrorController
    - FormManagementController   # SPA shell at /FormManagement
    - CustomerController         # root duplicate of Admin customer
    - Api/LoginApiController

