# -----------------------------------------------------------------------------
# Operational pipelines
# -----------------------------------------------------------------------------
pipelines:

  field_work:
    description: Excel/SFTP accounts → allocate installer → mobile visit → files → S3 → audit → reports
    stages:
      - id: ingest
        name: Account ingest
        writes: UploadedExcelData (+ tblUploadedData)
        mapping: TblProjectExcelMapping + VW_GETTab6DropdownData
        paths:
          - Admin Excel: ProjectController.SaveTab6Data
          - TNMP SFTP: UploadFile.getandSaveFile  # COMMENTED in Program.Main
        sftp_files:
          - { project_id: 10124, pattern: TNMP_CMS_RouteFile_yyyyMMdd.csv }
          - { project_id: 10087, pattern: TNMP_TNMP_RouteFile_yyyyMMdd.csv }
        date_rule: yesterday (AddDays(-1))
        sample_excel: ~/DownLoadFile/Sample Upload File.xlsx
        project_wizard_tabs:
          - { step: 1, ui: Create Project, save: SaveTab1 }
          - { step: 2, ui: Master Fields, save: SaveTab2Data }
          - { step: 3, ui: Configure Services, save: SaveTab3Data / SaveTab3DataMeterPayRate }
          - { step: 4, ui: Standard Fields, save: SaveTab4Data }
          - { step: 5, ui: Custom Fields, save: SaveTab5Data }
          - { step: 6, ui: Upload Customer Data, save: SaveTab6Data }

      - id: geocode
        name: Lat/long + VisitId/GroupId
        runners:
          - WebAPI CalculateLatLongController.GetLatLongForProject / CalPendingLatLongForProject
          - CMSAuditThread CalPendingLatLongAllAddress (commented in triggerScheduler)
        google: geocode XML API + distanceFromCityCenterInKM (40)
        columns: STREET / ADDRESS LATITUDE / ADDRESS LONGITUDE via FN_GetColumnName

      - id: allocate
        name: Installer allocation
        ui: InstallerAllocationController
        table: tblInstallerMapData
        history: tblInstallerMapDataHistory
        fields: [InstallerId, FK_UploadedExcelData_Id, FromDate, ToDate, BatchNumber, Active]
        related: TblProjectInstallers, Appointments, AppointmentAllocation

      - id: mobile_sync
        name: Push work to phone / drop old top records
        download: CMS_MobileService.OfflineUserDataAll + UserProjectData
        disable_old: CMSAuditThread CompleteTask.setMobileSyncStatus
        stored_proc: PROC_MobileSync_GetAfterTop
        effect: UploadedExcelData.SyncEnable = 0
        last_flag: setLastSynchFlag

      - id: field_save
        name: Save visit from mobile
        asmx: CMS_MobileService.SaveData
        dal: MobileDAL.saveDynamicData
        writes:
          - TblProjectFieldData           # JSON answers, skip, GPS, IsMediaPending
          - tblProjectFieldDataMasters    # per-field values
          - TblProjectFieldDataAttachment # photos/audio/video/map
          - tblUploadedData.IsVisisted
          - history tables on skip/reopen
        local_path: MobileUploadData\{projectId}\{formId}\{account}\{fieldId}\
        live_s3: UploadFileS3Bucket on save (best-effort; empty strCloudUrl on fail)
        media_api: WebAPI UploadFileController (image/audio/video, skip, custom, audit, from-web)
        media_pending_clear: UpdateMediaFlag

      - id: cloud_backfill
        name: Batch upload missing cloud URLs
        status: ACTIVE (only live TNMP Program.Main region as of Sep 2026)
        class: UploadFilesS3Bucekt.ProcessCloudUrls
        phase_1:
          method: UploadPendingCloudUrls
          table: TblProjectFieldDataAttachments
          filter: { Active: 1, strFilePath_contains: MobileUploadData, strCloudUrl: empty }
          order_by: ID
          batch: CloudUploadBatchSize (default 5000)
          disk_root: C:\inetpub\vhosts\datadepotonline.com\httpdocs\
          api: https://dddailyapi.mytiny.us/api/v1/file-upload
          save: per-row SaveChanges
        phase_2:
          method: ValidateAndFixBrokenCloudUrlsBatch
          on: ValidateExistingCloudUrls=true
          action: HEAD then GET; re-upload if broken
        legacy_not_called: getFilesPath (CreatedOn year 2026–2027)

      - id: audit
        name: Sample visits for auditors
        service: CMSShedulerService every 10800000 ms (3 hours)
        steps:
          - AddToAudit: set AuditDatas.AuditPercent from AuditInstallerPercentages; fail% bumps days via CustomerAuditFailureSettings (goto Outer)
          - AllocateAuditVisit: percent sample → ProjectAuditAllocation; skip if auditor == installer
        source_filter: AuditDatas AddedForAudit=0, IsTakenForCalculation!=1, Active=1
        ui: ProjectAuditController, Customer AuditSettings
        webapi: AuditAllocationController.AllocateAuditVisit(InstallerId)

      - id: export
        name: Completed-visit outbound
        ui: ExportReportController
        utility_status: COMMENTED in Program.Main
        jobs:
          - { name: csv_to_sftp, class: DownloadExportReport, dest_key: sftOutputFilePath }
          - { name: email_with_meter, project_id: 10134, utility_type: WITH_METER, class: DownloadExportReportSendbyEmail }
          - { name: email_without_meter, project_id: 10134, utility_type: WITHOUT_METER, class: ExportReportByEmail_2 }
        history: TblTNMPExportReportUtilityHistory
        date_window: last ToDateTime + 1 minute → yesterday 23:59
        visit_status: Completed
        form_type_id: 2

      - id: skip_unallocate
        name: Skipped accounts back to unallocated
        status: COMMENTED
        class: AccountStatus.SkipAccountMovedToUnAllocate
        related: TblUnAllocatedSkipHistory
        old_mobile_path: PendingAllCrossesDateAddress_AssignToUnallocateaddres (commented)

  inventory:
    description: Warehouse stock → receive → installer request/return → field consume → reports
    flow:
      - masters: WarehouseMaster, Category, ProductMaster, UtilityMaster, InventorySourceMaster
      - project_link: ProjectWarehouseRelation, ProjectServiceProductRelation, WarehouseUserRelation
      - upload_excel: UploadInventory → InventoryUpload / InventoryMobileUpload
      - receive: ReceiveInventry (web) / ReceiveWarehouseInventory + ReceiveUserInventory (mobile)
      - stock: InwardHeader/InwardDetail, OutwardDetail, StockDetail
      - request: StockRequest UI + InventoryMobileStockRequest(+Detail) + InventoryMobileUserStockRequest(+Detail)
      - return: InventoryMobileStockReturn(+Detail)
      - field_consume: tblProjectFieldDataInventoryDetail / tblProjectFieldDataInventoryOutwardDetail
      - transfer: InventoryBulkTransfer, WarehouseTransfer, OutwardTransferDetail
      - alerts: LowInventoryAlert, Missing_Inventory
      - signoff: InventoryUserSignOffDetail, UserSignOffRequest
      - reconcile: ViewReconcileDetailInventory
    sample_excel:
      - ~/DownLoadFile/Sample Inventory Upload File.xlsx
      - /../DownLoadFile/UploadFile.xlsx

  appointments:
    ui: AppointmentAllocationController / AppointmentController
    dal: AppointmentDAL / AppointmentAllocationDAL
    table: Appointments

  budget:
    ui: BudgetStatusReportController
    dal: BudgetStatusReportDAL
    table: ProjectBudgetMaster
    note: Running balance is computed (monthly/weekly/daily); not stored per period

