# -----------------------------------------------------------------------------
# Login + project URLs (usernames live in DB: tblUsers / AspNetUsers)
# -----------------------------------------------------------------------------
urls_and_login:
  web_login_route: /Global/Login
  web_controller: Areas/Global/Controllers/LoginController.cs  # POST Index
  after_login: Home/Index then Admin dashboard (RBAC)
  forgot_password: Login/ForgotPassword
  default_new_user_password_key: DefaultPassword   # Web.config — currently admin@123

  environments:
    local:
      site: http://localhost:6070/
      login: http://localhost:6070/Global/Login
      api_login: POST http://localhost:6070/api/login
      mobile_asmx: http://localhost:6070/CMS_MobileService.asmx
      mobile_login_method: UserLogin(userName, password, currentDate)
    live:
      site: https://www.datadepotonline.com/
      login: https://www.datadepotonline.com/Global/Login
      api_login: POST https://www.datadepotonline.com/api/login
      mobile_asmx: https://www.datadepotonline.com/CMS_MobileService.asmx
    legacy:
      cmsmeter: https://www.cmsmeter.com/CMSMA/
      staging_host: http://ts2.datadepotonline.com/

  credentials:
    note: >
      Real usernames are in SQL (tblUsers.UserName + AspNetUsers). There is no
      seeded admin in source. New users created in User Master get Web.config
      DefaultPassword unless the admin sets another password.
    default_password_for_new_users: admin@123
    sample_from_login_controller_comment:
      username: sanjiv@kairee.in
      password: Admin@123
      status: commented out in LoginController.Index — old local test hint only
    web_login_fields: [UserName, Password, RememberMe]
    web_validation:
      empty_user: User Name Required
      empty_password: Password Required
      bad_password: Invalid login attempt.
      inactive: User not active.
    api_login_body:
      UserName: string
      Password: string
      RememberMe: bool
    api_login_responses:
      ok: { success: true, userId, userName }
      bad: { success: false, message: "Invalid username or password" }
      inactive: { success: false, message: "User not active or not found" }
    mobile_login: CMS_MobileService.UserLogin
    mobile_currentDate: Unix seconds (not a calendar string)
    asmx_format: JSON ScriptMethod (ASMX HTML test form often cannot exercise these)
    new_user_password_expiry_days: 15   # UsersController Create1 sets PasswordExpiryDays = 15
    web_vs_api_username: >
      Web login: tblUsers row must be Active=1, then SignIn via
      UserManager.FindById(tblUsers.aspnet_UserId).
      API login: PasswordSignInAsync(model.UserName) — fails if
      tblUsers.UserName does not match AspNetUsers.UserName.
      Code comment in LoginController: those two names do not always match.

# -----------------------------------------------------------------------------
http_pipeline:
  startup_order:
    - Global.asax Application_Start
    - WebApiConfig.Register (attribute routes + Api/{controller}/{action} + api/{controller}/{id})
    - AreaRegistration.RegisterAllAreas
    - FilterConfig (HandleError → Error view)
    - RouteConfig
    - BundleConfig (optimizations OFF)
    - log4net XmlConfigurator
    - OWIN Startup.ConfigureAuth
  routes:
    ignore: ["*.axd", "*.asmx"]
    named:
      - FormManagement → FormManagementController.Index
      - FormManagement/Add|Edit/{id}|View/{id}|Clone → same SPA
    default_area: Global / Login
    fallback: Home/Index
  request_behavior:
    cache: no-store / no-cache on every BeginRequest
    ajax_401: rewritten to HTTP 306 in EndRequest
    errors: Application_Error logs and redirects ~/Error/Index
  filters:
    global: HandleErrorAttribute
    common_on_controllers:
      - Authorize
      - SessionExpire
      - RBACAttribute
      - OutputCache Duration=0
      - NoCacheAttribute

auth:
  type: OWIN cookie (ApplicationCookie)
  login_path: /Global/Login
  login_urls: see urls_and_login
  stamp_validate_minutes: 30
  session_expire:
    class: SessionExpireAttribute
    session_key: Username   # set on web login
    ajax_missing: HTTP 401 JSON { status: "401" }  # Global.asax may rewrite to 306
    full_page_missing: redirect ~/Global/Login
  identity_tables: [AspNetUsers, AspNetRoles, AspNetPermissions, AspNetRolePermissions, AspNetUserRolePermissions, tblUsers]
  rbac:
    class: RBACAttribute
    check_order:
      - Controller name permission
      - else Controller-Action
      - else Controller-Index (AJAX helpers)
      - SysAdmin bypass
    deny_redirect: Admin/Unauthorised/Index
    deny_message: You do not have access permission.
  login_web: LoginController → FindById(aspnet_UserId) → PasswordSignInAsync
  login_api: POST api/login (LoginApiController, AllowAnonymous) → PasswordSignInAsync(UserName)

